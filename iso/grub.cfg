# Boot-Menü der Noi-OS-Live-ISO (BIOS + UEFI)
set default=0
set timeout=8
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod png
loadfont unicode
set gfxmode=auto
terminal_output gfxterm

if background_image /boot/grub/background.png; then
    true
fi
set color_normal=light-gray/black
set color_highlight=white/green
set menu_color_normal=light-gray/black
set menu_color_highlight=white/green

menuentry "@DISTRO_NAME@ @DISTRO_VERSION@ starten" {
    linux  /casper/vmlinuz boot=casper locale=@LOCALE@ keyboard-configuration/layoutcode=@KEYMAP@ quiet splash ---
    initrd /casper/initrd
}
menuentry "@DISTRO_NAME@ starten (sicherer Grafikmodus)" {
    linux  /casper/vmlinuz boot=casper locale=@LOCALE@ keyboard-configuration/layoutcode=@KEYMAP@ nomodeset ---
    initrd /casper/initrd
}
menuentry "@DISTRO_NAME@ starten (in RAM laden)" {
    linux  /casper/vmlinuz boot=casper toram locale=@LOCALE@ keyboard-configuration/layoutcode=@KEYMAP@ quiet splash ---
    initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI-Firmware-Einstellungen" {
        fwsetup
    }
fi
menuentry "Neu starten" {
    reboot
}
menuentry "Ausschalten" {
    halt
}
