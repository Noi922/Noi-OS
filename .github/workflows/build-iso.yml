# Baut Noi OS auf GitHubs Servern und veröffentlicht alles als Release:
#   - Live-ISO (zum Installieren auf echter Hardware oder in einer VM)
#   - fertige VM-Images: .ova (VirtualBox/VMware), .qcow2 (Proxmox/KVM/UTM),
#     .vhdx.zip (Hyper-V) – beim ersten Start wird das eigene Konto angelegt
# Starten: Repo -> "Actions" -> "Noi OS bauen" -> "Run workflow".
# Oder automatisch beim Pushen eines Tags wie v1.0
# Außerdem automatisch am 1. jedes Monats (mit allen aktuellen Ubuntu-Updates).
name: Noi OS bauen

on:
  schedule:
    # Minute Stunde Tag Monat Wochentag (UTC) – hier: am 1. um 03:23 UTC
    - cron: "23 3 1 * *"
  workflow_dispatch:
    inputs:
      vm_images:
        description: "Auch fertige VM-Images bauen (OVA, QCOW2, VHDX)"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-iso
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      BUILD_VM: ${{ github.event_name != 'workflow_dispatch' || inputs.vm_images }}
      # Google-Drive-Upload nur, wenn das Geheimnis RCLONE_CONFIG eingetragen ist
      HAS_DRIVE: ${{ secrets.RCLONE_CONFIG != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Speicherplatz freigeben
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/share/powershell /usr/share/swift
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / /mnt || true

      - name: Build-Verzeichnis wählen
        run: |
          # /mnt ist auf GitHub-Runnern meist eine große Extra-Platte
          free_mnt=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc 0-9 || echo 0)
          if [ "${free_mnt:-0}" -ge 40 ]; then base=/mnt/noi; else base=$PWD/work; fi
          sudo mkdir -p "$base"
          echo "NOI_WORK=$base/build" >> "$GITHUB_ENV"
          echo "NOI_OUT=$base/out"    >> "$GITHUB_ENV"
          echo "Build-Verzeichnis: $base"

      - name: ISO bauen
        run: sudo --preserve-env=NOI_WORK,NOI_OUT ./build.sh

      - name: VM-Images bauen
        if: env.BUILD_VM == 'true'
        run: |
          # chroot wird nicht mehr gebraucht – Platz für die VM-Images schaffen
          sudo rm -rf "${NOI_WORK:?}/chroot"
          df -h "$NOI_WORK"
          sudo --preserve-env=NOI_WORK,NOI_OUT ./make-vm.sh

      - name: ISO nach Google Drive hochladen
        if: env.HAS_DRIVE == 'true'
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
          KEEP: 3
        run: |
          source config.sh
          sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          remote="$(sed -n 's/^\[\(.*\)\]$/\1/p' ~/.config/rclone/rclone.conf | head -1)"
          [ -n "$remote" ] || { echo "RCLONE_CONFIG enthält keinen [Namen]-Abschnitt"; exit 1; }
          sudo chown -R "$USER" "$NOI_OUT"
          ziel="noios-${DISTRO_VERSION}-$(date +%Y-%m-%d)-build${{ github.run_number }}.iso"
          echo "Lade $ISO_NAME als '$ziel' nach '$remote:Noi OS' hoch …"
          rclone copyto "$NOI_OUT/$ISO_NAME" "$remote:Noi OS/$ziel" --stats 60s --stats-one-line
          # Nur die neuesten $KEEP ISOs im Drive-Ordner behalten (Speicherplatz)
          rclone lsf "$remote:Noi OS" --files-only --include "noios-*.iso" | sort |
            head -n "-$KEEP" | while read -r alt; do
              echo "Entferne alte ISO: $alt"
              rclone deletefile "$remote:Noi OS/$alt"
            done
          rm -f ~/.config/rclone/rclone.conf

      - name: Für Upload vorbereiten
        id: prep
        run: |
          source config.sh
          sudo chown -R "$USER" "$NOI_OUT"
          cd "$NOI_OUT"
          rm -f test-disk.qcow2 *.sha256
          mkdir -p upload
          # GitHub-Releases erlauben max. 2 GB pro Datei -> große Dateien splitten
          for f in *.iso *.ova *.qcow2 *.vhdx.zip; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> upload/SHA256SUMS
            if [ "$(stat -c %s "$f")" -gt 2000000000 ]; then
              split -b 1900M -d -a 2 "$f" "upload/$f.part"
              rm -f "$f"
            else
              mv "$f" upload/
            fi
          done
          (cd upload && sha256sum ./*.part* >> SHA256SUMS 2>/dev/null || true)
          # Doppelklick-Helfer für Windows zum Zusammenfügen der Teile
          cp "$GITHUB_WORKSPACE/tools/Noi-OS-zusammenfuegen.bat" upload/
          ls -lh upload
          echo "dir=$NOI_OUT/upload" >> "$GITHUB_OUTPUT"
          echo "base=${DISTRO_ID}-${DISTRO_VERSION}-${ARCH}" >> "$GITHUB_OUTPUT"
          echo "version=$DISTRO_VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$DISTRO_NAME" >> "$GITHUB_OUTPUT"

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          b="${{ steps.prep.outputs.base }}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${{ steps.prep.outputs.version }}-build${{ github.run_number }}"
          fi
          sed -e "s/@BASE@/$b/g" -e "s/@SHA@/${GITHUB_SHA::7}/g" \
              -e "s/@NAME@/${{ steps.prep.outputs.name }}/g" \
              -e "s/@VERSION@/${{ steps.prep.outputs.version }}/g" \
              .github/release-notes.md > notes.md
          gh release create "$tag" "${{ steps.prep.outputs.dir }}"/* \
            --title "${{ steps.prep.outputs.name }} ${{ steps.prep.outputs.version }} (Build ${{ github.run_number }}, $(date +%d.%m.%Y))" \
            --notes-file notes.md

      - name: Alte automatische Builds aufräumen
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 3
        run: |
          # Nur automatisch erzeugte Releases (Tag vX.Y-buildN) – von Hand
          # getaggte Versionen wie v1.0 bleiben immer erhalten.
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v.*-build[0-9]+$"))]
                  | sort_by(.createdAt) | reverse | .['"$KEEP"':] | .[].tagName' |
          while read -r tag; do
            echo "Lösche altes Release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
